name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v2.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify, build, and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        id: check_signing
        env:
          TAG_KEYSTORE_BASE64: ${{ secrets.TAG_KEYSTORE_BASE64 }}
          TAG_STORE_PASSWORD: ${{ secrets.TAG_STORE_PASSWORD }}
          TAG_KEY_ALIAS: ${{ secrets.TAG_KEY_ALIAS }}
          TAG_KEY_PASSWORD: ${{ secrets.TAG_KEY_PASSWORD }}
        run: |
          if [ -n "$TAG_KEYSTORE_BASE64" ] && \
             [ -n "$TAG_STORE_PASSWORD" ] && \
             [ -n "$TAG_KEY_ALIAS" ] && \
             [ -n "$TAG_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Release signing secrets (TAG_KEYSTORE_BASE64, TAG_STORE_PASSWORD, TAG_KEY_ALIAS, TAG_KEY_PASSWORD) are required."
              exit 1
            else
              echo "::notice::Release signing secrets are not configured; skipping CI APK build and release upload so unsigned APKs are never published."
            fi
          fi

      - name: Check out
        if: steps.check_signing.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        if: steps.check_signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.check_signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        if: steps.check_signing.outputs.configured == 'true'
        env:
          TAG_KEYSTORE_BASE64: ${{ secrets.TAG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$TAG_KEYSTORE_BASE64" | base64 -d > keystore/tag-release.jks

      - name: Verify unit tests, lint, androidTest compilation, and build release APK
        if: steps.check_signing.outputs.configured == 'true'
        env:
          TAG_STORE_PASSWORD: ${{ secrets.TAG_STORE_PASSWORD }}
          TAG_KEY_ALIAS: ${{ secrets.TAG_KEY_ALIAS }}
          TAG_KEY_PASSWORD: ${{ secrets.TAG_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:compileDebugAndroidTestKotlin :app:assembleRelease --stacktrace

      - name: Verify APK signature and stage release asset
        if: steps.check_signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Signed APK not found at $APK"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(ls -1 "$SDK_DIR"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under '$SDK_DIR/build-tools'"
            exit 1
          fi

          CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERT_INFO"
          EXPECTED_SHA256="2d02230939cd6a0f5182591d146a854e8fed51d661eb1b2572437c6f02ead547"
          if ! echo "$CERT_INFO" | grep -qi "Signer #1 certificate SHA-256 digest: ${EXPECTED_SHA256}"; then
            echo "::error::APK signing certificate SHA-256 does not match expected ${EXPECTED_SHA256}"
            exit 1
          fi

          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p release-assets
          cp "$APK" "release-assets/Tag-${VERSION}-release.apk"

      - name: Publish GitHub Release
        if: steps.check_signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          APK_PATH="release-assets/Tag-${VERSION}-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "Tag-${VERSION}-release.apk" \
              --generate-notes
          fi
