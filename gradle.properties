# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# The host sandbox denies the native file-watcher thread handle, so watching is off.
org.gradle.vfs.watch=false
org.gradle.console=plain

# This network drops connections intermittently, so be patient while resolving.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=500

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# NOTE: this network cannot reach Google Maven reliably, so local builds pass
#   -Pandroid.aapt2FromMavenOverride=<sdk>/build-tools/35.0.0/aapt2.exe
# on the command line. It is deliberately not pinned here, because an absolute
# host path would break CI and other machines.

kotlin.code.style=official
